name: APK bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle-Cache
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true

      - name: Debug-APK bauen
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Versionsname auslesen
        id: version
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BlockMail-v${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK im Branch apk-latest ablegen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          BLOB=$(git hash-object -w app/build/outputs/apk/debug/app-debug.apk)
          TREE=$(printf '100644 blob %s\tBlockMail-latest.apk\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "APK v${{ steps.version.outputs.name }} aus ${{ github.sha }}")
          # GitHub lehnt den Force-Push gelegentlich mit
          # "fatal error in commit_refs" ab — das ist ein Aussetzer auf
          # deren Seite, kein Fehler am Build. Deshalb bis zu viermal
          # wiederholen, statt den ganzen Lauf rot zu faerben.
          for i in 1 2 3 4; do
            if git push --force origin "$COMMIT:refs/heads/apk-latest"; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i) — neuer Versuch in $((i*5))s"
            sleep $((i*5))
          done
          exit 1

      - name: APK an "latest"-Release anhängen
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "BlockMail-v${{ steps.version.outputs.name }}.apk"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "BlockMail-v${{ steps.version.outputs.name }}.apk" \
            --title "BlockMail v${{ steps.version.outputs.name }} (aktueller Stand)" \
            --notes "Automatisch gebaute Debug-APK vom letzten Push (${{ github.sha }})." \
            --prerelease

      - name: Versioniertes Release anlegen/aktualisieren
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "BlockMail-v$V.apk"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "BlockMail-v$V.apk" --clobber
          else
            gh release create "v$V" "BlockMail-v$V.apk" \
              --title "BlockMail v$V" \
              --notes "Debug-APK der Version $V (Stand ${{ github.sha }})."
          fi

  # Signiertes Play-Store-Bundle (AAB) – läuft nur, wenn der Upload-Schlüssel
  # als Secret hinterlegt ist (UPLOAD_KEYSTORE_BASE64 + UPLOAD_KEYSTORE_PASSWORD).
  bundle:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'claude/')
    steps:
      - name: Secrets prüfen
        id: check
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret UPLOAD_KEYSTORE_BASE64 fehlt – das Play-Store-Bundle wird übersprungen. Anleitung: docs/playstore.md"
          else
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Code auschecken
        if: steps.check.outputs.vorhanden == 'true'
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        if: steps.check.outputs.vorhanden == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle-Cache
        if: steps.check.outputs.vorhanden == 'true'
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true

      - name: Upload-Schlüssel entpacken
        if: steps.check.outputs.vorhanden == 'true'
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Signiertes Bundle bauen
        if: steps.check.outputs.vorhanden == 'true'
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Versionsname auslesen
        if: steps.check.outputs.vorhanden == 'true'
        id: version
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Bundle als Artefakt hochladen
        if: steps.check.outputs.vorhanden == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlockMail-v${{ steps.version.outputs.name }}-store-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Bundle im Branch aab-latest ablegen
        if: steps.check.outputs.vorhanden == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          BLOB=$(git hash-object -w app/build/outputs/bundle/release/app-release.aab)
          TREE=$(printf '100644 blob %s\tBlockMail-store.aab\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "AAB v${{ steps.version.outputs.name }} aus ${{ github.sha }}")
          # GitHub lehnt den Force-Push gelegentlich mit
          # "fatal error in commit_refs" ab — das ist ein Aussetzer auf
          # deren Seite, kein Fehler am Build. Deshalb bis zu viermal
          # wiederholen, statt den ganzen Lauf rot zu faerben.
          for i in 1 2 3 4; do
            if git push --force origin "$COMMIT:refs/heads/aab-latest"; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i) — neuer Versuch in $((i*5))s"
            sleep $((i*5))
          done
          exit 1

      - name: Bundle an Store-Release anhängen
        if: steps.check.outputs.vorhanden == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.name }}"
          cp app/build/outputs/bundle/release/app-release.aab "BlockMail-v$V-store.aab"
          if gh release view "store-v$V" >/dev/null 2>&1; then
            gh release upload "store-v$V" "BlockMail-v$V-store.aab" --clobber
          else
            gh release create "store-v$V" "BlockMail-v$V-store.aab" \
              --title "BlockMail v$V (Play-Store-Bundle)" \
              --notes "Signiertes App-Bundle (AAB) der Version $V für den Play Store."
          fi

      # ---- BlockPDF: zweite App aus demselben Bau (bundleRelease baut beide)

      - name: BlockPDF-Version auslesen
        if: steps.check.outputs.vorhanden == 'true'
        id: pdfversion
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' blockpdf/build.gradle.kts)
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: BlockPDF-Bundle als Artefakt hochladen
        if: steps.check.outputs.vorhanden == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlockPDF-v${{ steps.pdfversion.outputs.name }}-store-aab
          path: blockpdf/build/outputs/bundle/release/blockpdf-release.aab

      - name: BlockPDF-Bundle im Branch aab-blockpdf-latest ablegen
        if: steps.check.outputs.vorhanden == 'true'
        run: |
          BLOB=$(git hash-object -w blockpdf/build/outputs/bundle/release/blockpdf-release.aab)
          TREE=$(printf '100644 blob %s\tBlockPDF-store.aab\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "BlockPDF-AAB v${{ steps.pdfversion.outputs.name }} aus ${{ github.sha }}")
          for i in 1 2 3 4; do
            if git push --force origin "$COMMIT:refs/heads/aab-blockpdf-latest"; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i) — neuer Versuch in $((i*5))s"
            sleep $((i*5))
          done
          exit 1
