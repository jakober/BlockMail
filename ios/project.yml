name: BlockMail
options:
  bundleIdPrefix: com.jakober
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    # Archiv für TestFlight direkt mit dem Verteilungs-Zertifikat signieren —
    # sonst verlangt Apple erst ein Development-Profil mit registriertem Gerät
    Release:
      CODE_SIGN_IDENTITY: "Apple Distribution"
targets:
  BlockMail:
    type: application
    platform: iOS
    sources:
      - path: BlockMail
    info:
      path: BlockMail/Info.plist
      properties:
        CFBundleDisplayName: BlockMail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        GoogleIOSClientID: $(GOOGLE_IOS_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers:
          - com.jakober.blockmail.refresh
          - com.jakober.blockmail.maintenance
        NSCameraUsageDescription: Zum Einscannen von Dokumenten als PDF.
        NSFaceIDUsageDescription: Zum Schutz der App.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Bild
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        CFBundleURLTypes:
          - CFBundleURLName: com.jakober.blockmail
            CFBundleURLSchemes: [blockmail]
    entitlements:
      path: BlockMail/BlockMail.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.jakober.blockmail]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: BlockMailWidget
  BlockMailWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BlockMailWidget
      - path: BlockMail/Core/Data/MailMessage.swift
      - path: BlockMail/Core/Data/L.swift
      - path: BlockMail/Resources
        excludes: ["Assets.xcassets"]
    info:
      path: BlockMailWidget/Info.plist
      properties:
        CFBundleDisplayName: BlockMail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BlockMailWidget/BlockMailWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jakober.blockmail]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  BlockMailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlockMailTests
    dependencies:
      - target: BlockMail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
schemes:
  BlockMail:
    build:
      targets:
        BlockMail: all
    test:
      targets:
        - BlockMailTests
    run:
      config: Debug
    archive:
      config: Release
